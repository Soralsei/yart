name: MacOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release
  INSTALL_LOCATION: .local

jobs:
  build:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - uses: actions/checkout@v4

      - name: cache dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: ${{ github.workspace }}/${{ env.INSTALL_LOCATION }}
          key: ${{ runner.os }}-dependencies

      - name: install GoogleTest
        if: ${{ steps.cache.output.cache-hit != 'true' }}
        run: |
          cd ..
          git clone  --depth 1 --branch v1.14.0 https://github.com/google/googletest.git
          cd googletest
          cmake -Bbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_LOCATION
          cmake --build build --config Release
          cmake --build build --target install --config Release
          cd ../yart

      - name: configure
        run: cmake -Bbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_LOCATION

      - name: install glm
        if: ${{ steps.cache.output.cache-hit != 'true' }}
        run: |
          cd ..

          git clone --depth 1 --branch 1.0.2 https://github.com/g-truc/glm.git
          cd glm

          cmake \
            -DGLM_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -B build .
          cmake --build build -- all
          cmake --build build -- install
          
          cd ../yart

      - name: build
        run: cmake --build build --config $BUILD_TYPE -j4

      - name: run tests
        run: |
          cd build
          ctest -C $BUILD_TYPE -VV

      - name: install project
        run: cmake --build build --target install --config Release
